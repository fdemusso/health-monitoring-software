# Backend + Cloudflare Tunnel. From the repository root:
#   cp deploy/.env.example deploy/.env      # then fill the two secrets
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Nothing publishes a port: the only way in is the tunnel (docs/deploy.md).
services:
  ares3:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ares3-serve
    restart: unless-stopped
    command:
      - serve
      - scenarios/station/nominal.yaml
      - --host=0.0.0.0
      - --speed=10
      - --pause-when-idle            # nobody connected: the simulation stands still (0 % CPU); it resumes with the first visitor
      - --fps=${ARES3_FPS:-5}        # frames per second to each client: ~1 Mbit/s per viewer at 10, about half at 5
      - --warmup-h=4                 # ~1 min at start: the ML is ready and the charts start full
      - --warmup-cache=/cache        # saved after the first warm-up: a restart (same code and scenario) is instant
      - --allow-origin=${ARES3_ORIGIN:-https://ares.daado.dev}
      - --max-speed=60               # what a client can ask for (a public server must not run flat out)
      - --max-clients=${ARES3_MAX_CLIENTS:-8}
      - --guest-commands=${ARES3_GUEST_COMMANDS-approve_action,reject_action,ack_step,inject_event,stop_event,reset}   # what a visitor without token may do; empty = watch only
    environment:
      ARES3_TOKEN: ${ARES3_TOKEN:?set ARES3_TOKEN in deploy/.env}   # whoever has it can send commands; the others only watch
    mem_limit: 1g
    cpus: 1.5
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    volumes:
      - ares3-cache:/cache           # survives restarts and rebuilds; `docker compose down -v` deletes it

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in deploy/.env}
    depends_on: [ares3]
    mem_limit: 256m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  ares3-cache:
