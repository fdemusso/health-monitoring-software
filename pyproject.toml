[project]
name = "ares3"
version = "0.1.0"
description = "ARES 3 - astronaut health & habitat simulation engine (NASA Space Apps 2026)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "openpyxl>=3.1"]
report = ["matplotlib>=3.8"]
serve = ["websockets>=13"]

[project.scripts]
ares3 = "ares3.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ares3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
