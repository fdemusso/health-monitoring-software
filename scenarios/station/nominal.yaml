# The OFFICIAL station: Mario's ISS model (generated files modules / sensors / actuators) + the lifeboat, the EVA volume and the
# crew. No scheduled faults: a nominal day. Event scenarios are in events/ (one per fault of the catalog, sheet 06_GUASTI).
name: station_nominal
seed: 42
dt_s: 1.0
duration_days: 1
start_time_of_day_h: 6.0
environment: ../environments/iss_station.yaml
layout: [modules.yaml, extras.yaml, sensors.yaml, actuators.yaml]
crew: crew.yaml
monitor: monitor.yaml
export: {format: parquet, chunk_hours: 1.0, long: true, wide: true}
