# PLACEHOLDER - awaiting the team (and Mario for the final sensor set). Monitoring system: detectors -> classifier -> playbooks.
# Rules refer to METRICS on modules, never to sensor ids, so changing the sensor set does not touch this file.
# Model: ISS emergency response (NASA SpaceOps 2023): immediate reversible safing is `auto`; heavier steps are `confirm`
# (any crew member or the UI can approve; on timeout `execute` for life-saving steps, `discard` otherwise).
# Thresholds are ESTIMATES unless a source is given.
# mode_hold_s: the monitoring mode (passive / alert / reaction) falls only after this long without the higher one.
# classes: what the crew sees (emergency red, warning orange, caution yellow, advisory blue); not listed: critical -> emergency,
# warning -> warning. ISS levels [R1][R2]: a high CO2 mean is a caution; a fever of a crew member is a warning.
classifier:
  confirm_s: 5
  clear_s: 60
  mode_hold_s: 60
  group_by: connected   # one leak = one emergency, in the module that falls fastest (the open hatches drain the neighbours too)
  classes:
    equipment: caution
    anomaly: caution
    sensor_fault: caution

detectors:
  # Loss of cabin air. The ISS grades it by rate [ICES-2025-126, NASA]: rapid depressurization >= 0.87 mmHg/min, fast leak
  # 0.4-0.87, slow leak < 0.4. The window decides how small a rate stands out of the sensor noise (the P probe has 0.05 kPa of
  # noise, so a 60 s window moves by +-1 mmHg/min on a normal day: measured over 24 h on the station profile, 3x margin kept):
  #   30 s -> breach (>= 8 mmHg/min), 300 s -> rapid (the ISS 0.87), 30 min -> fast (the ISS 0.4), 2 h -> slow (0.1),
  #   6 h -> trend (0.03).
  # Rapid and breach are CRITICAL (the crew retreats); fast and slow are warnings (the crew finds and patches the leak).
  # TRes (ISS reserve time to 490 mmHg) is reported by all of them; the shortest one reaches the crew response.
  - id: leak_breach
    kind: "ares3.plugins.monitor.detectors:PressureDrop"
    emergency: depressurization
    metric: P
    params: {window_s: 30, min_drop_mmhg_min: 8.0}
  - id: leak_rapid
    kind: "ares3.plugins.monitor.detectors:PressureDrop"
    emergency: depressurization
    metric: P
    params: {window_s: 300, min_drop_mmhg_min: 0.87}   # ISS rapid depressurization threshold
    confirm_s: 30
    clear_s: 300
  - id: leak_fast
    kind: "ares3.plugins.monitor.detectors:PressureDrop"
    emergency: depressurization
    severity: warning
    metric: P
    params: {window_s: 1800, min_drop_mmhg_min: 0.4}   # ISS fast leak threshold
    confirm_s: 300
    clear_s: 600
  - id: leak_slow
    kind: "ares3.plugins.monitor.detectors:PressureDrop"
    emergency: depressurization
    severity: warning
    metric: P
    params: {window_s: 7200, min_drop_mmhg_min: 0.1}   # ESTIMATE: ~6 mmHg/h, like the 2020 ISS intermediate-chamber leak (7-9 mmHg/h)
    confirm_s: 600
    clear_s: 900
  - id: leak_trend
    kind: "ares3.plugins.monitor.detectors:PressureDrop"
    emergency: depressurization
    severity: warning
    metric: P
    params: {window_s: 21600, min_drop_mmhg_min: 0.03}   # ESTIMATE: ~2 mmHg/h, seen only as a trend over hours (the ISS sees 2 mmHg/day)
    confirm_s: 1800
    clear_s: 1800
  # Pressure LEVEL: a leak that bleeds a module towards vacuum slows down (the flow is proportional to the pressure), so the
  # rate alone would clear it. Only the hard floor: a higher "low pressure" level would hold the emergency open after the leak
  # is gone, with the make-up gas forced off by the playbook and so no way for the pressure to recover. The EVA volume is left
  # out: its suit atmosphere (~47 kPa) is below 490 mmHg by design.
  - id: pressure_minimum
    kind: "ares3.plugins.monitor.detectors:Threshold"
    emergency: depressurization
    metric: P
    targets: [hab, lab, greenhouse, airlock, lifeboat]
    params: {min: 65.3}   # 490 mmHg: the ISS Pminimum [ICES-2025-126]
    clear_s: 120
  # High CO2 is an equipment problem (scrubber), not a toxic spill. Same limit AND same meaning as the profile alarm
  # `ppco2_1h` (NASA-STD-3001 [V2 6004], [S6]): max 3 mmHg as a 1-hour MEAN. Keep both in sync with the environment profile.
  - id: ppco2_mean_1h
    kind: "ares3.plugins.monitor.detectors:Threshold"
    emergency: equipment
    severity: warning
    metric: ppCO2
    params: {max: 3.0, window_s: 3600}
  # Sensor health (the fault catalog's "sensore bloccato / rumore" and "sensori ridondanti che non concordano", sheet 06).
  # Variance compares each sensor with ITS OWN usual noise (no unit): stuck = no noise at all, noisy = 3x its usual level.
  # RedundancyResidual compares the redundant sensors of one module: what counts is how far their difference MOVES from the
  # offset they had when the baseline was learned (every unit has its own fixed error). max_change is in the unit of the metric:
  # about 3x the noise of the window mean plus the lag differences of two units (ESTIMATES, checked on nominal days with
  # tools/ml/check_monitor.py). Both are `warning` -> class `caution` (the data may be wrong, nothing is isolated).
  - {id: stuck_T, kind: "ares3.plugins.monitor.detectors:Variance", emergency: sensor_fault, severity: warning, metric: T, confirm_s: 600, clear_s: 1800}
  - {id: stuck_RH, kind: "ares3.plugins.monitor.detectors:Variance", emergency: sensor_fault, severity: warning, metric: RH, confirm_s: 600, clear_s: 1800}
  - {id: stuck_P, kind: "ares3.plugins.monitor.detectors:Variance", emergency: sensor_fault, severity: warning, metric: P, confirm_s: 600, clear_s: 1800}
  - {id: stuck_ppO2, kind: "ares3.plugins.monitor.detectors:Variance", emergency: sensor_fault, severity: warning, metric: ppO2, confirm_s: 600, clear_s: 1800}
  - {id: stuck_ppCO2, kind: "ares3.plugins.monitor.detectors:Variance", emergency: sensor_fault, severity: warning, metric: ppCO2, confirm_s: 600, clear_s: 1800}
  - {id: resid_P, kind: "ares3.plugins.monitor.detectors:RedundancyResidual", emergency: sensor_fault, severity: warning, metric: P,
     params: {max_change: 0.15}, confirm_s: 600, clear_s: 1800}
  - {id: resid_T, kind: "ares3.plugins.monitor.detectors:RedundancyResidual", emergency: sensor_fault, severity: warning, metric: T,
     params: {max_change: 0.3}, confirm_s: 600, clear_s: 1800}
  - {id: resid_RH, kind: "ares3.plugins.monitor.detectors:RedundancyResidual", emergency: sensor_fault, severity: warning, metric: RH,
     params: {max_change: 2.0}, confirm_s: 600, clear_s: 1800}
  - id: resid_ppO2
    kind: "ares3.plugins.monitor.detectors:RedundancyResidual"
    emergency: sensor_fault
    severity: warning
    metric: ppO2
    targets: [all_modules]   # SWAP-RESID
    params: {max_change: 0.6}   # above the step of a calibration (the cell drifts -24 %/yr and is reset every 30 d: up to 0.42 kPa, a healthy event); 0.15-0.4 gave false alarms on nominal days
    confirm_s: 600
    clear_s: 1800
  - id: resid_ppCO2
    kind: "ares3.plugins.monitor.detectors:RedundancyResidual"
    emergency: sensor_fault
    severity: warning
    metric: ppCO2
    targets: [all_modules]   # SWAP-RESID
    params: {max_change: 0.06}
    confirm_s: 600
    clear_s: 1800
  # Fire (ISS: smoke detectors + combustion-product analyser). Thresholds are ESTIMATES until Mario fixes the sensors.
  - id: smoke
    kind: "ares3.plugins.monitor.detectors:Threshold"
    emergency: fire
    metric: smoke
    params: {max: 0.5, window_s: 0}   # mg/m3 of particulates
  - id: combustion_co
    kind: "ares3.plugins.monitor.detectors:Threshold"
    emergency: fire
    metric: CO
    params: {max: 25.0, window_s: 0}   # ppm

  # A crew member in trouble, seen through the wearables. The monitor reads sensed values only. The causes are listed from the
  # most specific to the least: SpCO (COHb, co-oximetry) sees carbon monoxide that the pulse oximeter (spo2) cannot.
  # Thresholds are ESTIMATES (resting COHb ~0.4 %; SpO2 < 90 % is the usual hypoxaemia cut-off); confirm with the bioengineer.
  - id: cohb_critical
    kind: "ares3.plugins.monitor.detectors:NpcThreshold"
    emergency: medical
    targets: [all_npcs]
    metric: cohb_pct
    cause: co_poisoning
    params: {max: 15.0}
    confirm_s: 30
    clear_s: 900   # a poisoning does not resolve in a minute: no flicker around the threshold
  - id: cohb_raised
    kind: "ares3.plugins.monitor.detectors:NpcThreshold"
    emergency: medical
    severity: warning
    targets: [all_npcs]
    metric: cohb_pct
    cause: co_poisoning
    params: {max: 5.0}
    confirm_s: 30
    clear_s: 900
  - id: low_spo2
    kind: "ares3.plugins.monitor.detectors:NpcThreshold"
    emergency: medical
    targets: [all_npcs]
    metric: spo2
    cause: hypoxia
    params: {min: 90.0}
    confirm_s: 15
    clear_s: 300
  - id: high_core_temp
    kind: "ares3.plugins.monitor.detectors:NpcThreshold"
    emergency: medical
    severity: warning
    targets: [all_npcs]
    metric: core_temp_c
    cause: fever_or_heat
    params: {max: 38.5}
    confirm_s: 60
    clear_s: 600
  - id: impaired
    kind: "ares3.plugins.monitor.detectors:NpcThreshold"
    emergency: medical
    targets: [all_npcs]
    metric: health_state
    params: {max: 1.5}   # health state >= 2 (impaired): something is wrong, cause unknown
    confirm_s: 3
    clear_s: 300

  # Early warning score (NEWS2-like [R8], on the 5-minute mean of the wearables): 5 or more, or one vital at 3 points, is a warning;
  # 7 or more is critical. HR and breathing are not scored during exercise. ESTIMATE, to confirm with the bioengineer. Listed last:
  # the specific causes above (SpCO, SpO2, ...) win when they fire too.
  - id: news_warning
    kind: "ares3.plugins.monitor.detectors:EarlyWarningScore"
    emergency: medical
    severity: warning
    targets: [all_npcs]
    params: {min_score: 5}
    confirm_s: 300
    clear_s: 600
  - id: news_critical
    kind: "ares3.plugins.monitor.detectors:EarlyWarningScore"
    emergency: medical
    severity: critical
    targets: [all_npcs]
    params: {min_score: 7, single_3: false}
    confirm_s: 60
    clear_s: 600

  # @ML-DETECTORS (the station adds the trained stage A / B detectors here, LAST: a rule that names a cause wins over a diagnosis: tools/build_station.py)

# NPC reaction: ISS Warn -> Gather -> Work. Roles/succession by crew PROFILE. Timings are ESTIMATES.
crew_response:
  roles: {commander: incident_commander, engineer: systems, medic: medical, botanist: sensing}
  succession: [commander, engineer, botanist, medic]   # who takes command if the commander is incapacitated (OUR proposal)
  gather_on: [depressurization, fire, toxic]
  react_delay_s: [2, 6]
  asleep_extra_delay_s: 30
  evacuate_tres_s: 600   # ISS: at 10 minutes of reserve time the crew stops leak isolation and retreats [ICES-2025-126]
  seal_vehicle: true     # all aboard -> the escape vehicle's hatches are closed
  repair_leak_s: 1800    # ESTIMATE: time to find and patch a leak that is only a warning
  stand_down_delay_s: 120
  npc_approves_actions: false   # true: the acting commander approves pending steps once at the safe haven

playbooks:
  # Rapid depressurization (critical). The ISS vehicle response [ICES-2025-126]: stop gas introduction (so the crew can
  # measure the leak rate), fans off (so they can hear and feel the leak), isolate the affected module. The escape vehicle's
  # hatch is NOT opened here: it stays closed until the crew retreats into it (crew_response), so it keeps its air.
  - emergency: depressurization
    severity: critical
    actions:
      - {do: actuator, target: "press_{module}", command: "off", level: auto, reason: stop make-up gas to measure the leak}
      - {do: actuator, target: "o2gen_{module}", command: "off", level: auto, reason: stop gas introduction}
      - {do: ventilation, target: "{module}", command: "off", level: auto, reason: fans off to hear and feel the leak}
      - {do: announce, target: crew, command: depressurization, level: auto}
      # heavy step: seal the leaking module from the hab. Never a hatch between the crew and the lifeboat.
      - {do: hatch, target: "hab:{module}", command: close, level: confirm, confirm_timeout_s: 20, on_timeout: execute,
         reversible: false, reason: isolate the leaking module}
  # Fast or slow leak (warning): no group alarm and gas introduction stays on (it makes up the loss while the crew looks for it).
  # The crew checks the leak by closing the hatch to the suspect module; nothing is forced if nobody answers.
  - emergency: depressurization
    severity: warning
    actions:
      - {do: announce, target: crew, command: leak_check, level: auto}
      - {do: hatch, target: "hab:{module}", command: close, level: confirm, confirm_timeout_s: 300, on_timeout: discard,
         reason: leak check - close the hatch to see which side is leaking}
  - emergency: equipment
    actions:
      - {do: announce, target: crew, command: equipment_alert, level: auto}
      - {do: actuator, target: "scrubber_{module}", command: "on", level: auto, reason: maximise CO2 removal}
  # ISS fire response: attack oxygen (no airflow, no gas introduction) and heat; the crew then discharges the extinguisher.
  - emergency: fire
    actions:
      - {do: ventilation, target: "{module}", command: "off", level: auto, reason: no airflow to the fire (no convection in microgravity)}
      - {do: actuator, target: "o2gen_{module}", command: "off", level: auto, reason: stop oxygen generation}
      - {do: actuator, target: "press_{module}", command: "off", level: auto, reason: stop gas introduction}
      # ISS automatic response to smoke [R3]: the racks of the module lose their power (the electrical ignition source goes; the
      # fire weakens to ~20 %, fault param `unpowered_factor`). The crew decides when to restore it: after the emergency it is only proposed.
      - {do: power, target: "{module}", command: "off", level: auto, reason: remove the power of the burning module}  # SWAP-POWER
      - {do: announce, target: crew, command: fire, level: auto}
      - {do: extinguish, target: "{module}", command: discharge, level: confirm, confirm_timeout_s: 60, on_timeout: execute,
         reversible: false, reason: the crew locates the source and discharges the extinguisher}
  # a sensor that no longer tells the truth (stuck, noisy, or the culprit of a redundancy mismatch): the crew is told and the control
  # loops can read its redundant sensor instead (`substitutes`, generated for the station). Nothing is forced: confirm, then drop.
  - emergency: sensor_fault
    actions:
      - {do: sensor, target: "{subject}", command: substitute, value_id: auto, level: confirm, confirm_timeout_s: 600, on_timeout: discard,
         reason: "do not trust the sensor: the control loops read its redundant sensor instead"}
  # a crew member in trouble: the medic goes to them (crew_response); the cause is in the emergency
  - emergency: medical
    actions:
      - {do: announce, target: crew, command: medical_alert, level: auto}

# Crew procedures (the checklist for the PEOPLE; the playbooks above are the safing of the machine). Chosen by (emergency, cause,
# severity): the one that names the cause wins. Steps: instruction (closed by the UI, or by the NPC of the role after duration_s),
# check (automatic, on SENSED values), question (yes -> on_pass, no -> on_fail), escalate (ends as `escalated`), action (a playbook step).
# Content rebuilt from public sources (plan D3, [R7] [R8] [R12]-[R17], [R20]-[R26] in docs/procedure-mediche.md): ESTIMATE, to be reviewed by the bioengineer. Only items of the
# ISS medical kit are named, NEVER doses ("as per the flight surgeon / the medical checklist"). A treatment does not change the
# simulated physiology (Luca's model is out of scope): the checks are written on what the simulator can produce (clean air, a removed source).
procedures:
  - id: med_hypoxia
    emergency: medical
    cause: hypoxia
    title: "Hypoxia: SpO2 below 90 % ({subject})"
    steps: &hypoxia_steps
      - {id: s1, do: instruction, role: medical, duration_s: 20, text: "Reach {subject}; check consciousness, breathing and the oxygen partial pressure of {module}"}
      - {id: s2, do: instruction, role: medical, duration_s: 30, text: "If the air of {module} is poor, move {subject} to the nearest module with normal air"}
      - {id: s3, do: instruction, role: medical, duration_s: 30, text: "Give oxygen with the Variable Oxygen System, target SpO2 94-98 %"}
      - {id: s4, do: check, metric: spo2, min: 94, within_s: 300, on_pass: done, on_fail: s5}
      - {id: s5, do: escalate, text: "SpO2 is not improving: call the flight surgeon and prepare the evacuation to the lifeboat"}
  - id: med_co
    emergency: medical
    cause: co_poisoning
    title: "Carbon monoxide: COHb raised ({subject})"
    steps: &co_steps
      - {id: s1, do: instruction, role: medical, duration_s: 20, text: "Take {subject} out of {module} and away from the source of CO"}
      - {id: s2, do: instruction, role: medical, duration_s: 20, text: "100 % oxygen at once with the Variable Oxygen System and a non-rebreather mask"}
      - {id: s3, do: question, role: medical, duration_s: 15, auto_answer: "no", text: "Is there still carbon monoxide in {module}?", on_pass: s4, on_fail: s5}
      - {id: s4, do: instruction, role: systems, duration_s: 20, text: "Ventilation off and isolate {module}, measure with the detector tubes before anyone goes back in", on_pass: s5}
      - {id: s5, do: check, metric: cohb_pct, max: 15, within_s: 900, on_pass: done, on_fail: s6}
      - {id: s6, do: escalate, text: "COHb not falling or above 15 %: call the flight surgeon, consider the evacuation"}
  - id: med_heat
    emergency: medical
    cause: fever_or_heat
    title: "High core temperature ({subject})"
    steps:
      - {id: s1, do: question, role: medical, duration_s: 15, auto_answer: "no", text: "Was {subject} exercising, or is {module} hot?", on_pass: s2, on_fail: s3}
      - {id: s2, do: instruction, role: medical, duration_s: 30, text: "Heat stroke: stop the exercise, cool actively (cold pack), oral fluids. No antipyretics", on_pass: s4}
      - {id: s3, do: instruction, role: medical, duration_s: 30, text: "Fever: rest and fluids; an antipyretic only if the flight surgeon says so"}
      - {id: s4, do: check, metric: core_temp_c, max: 38.5, within_s: 3600, on_pass: done, on_fail: s5}
      - {id: s5, do: escalate, text: "Temperature not falling: call the flight surgeon"}
  - id: med_generic
    emergency: medical
    title: "{subject} is unwell (cause not known)"
    steps:
      - {id: s1, do: instruction, role: medical, duration_s: 20, text: "Reach {subject}; check consciousness, breathing, pulse and temperature"}
      - {id: s2, do: instruction, role: medical, duration_s: 30, text: "Follow the medical checklist for the symptoms; keep {subject} at rest"}
      - {id: s3, do: escalate, text: "Report to the flight surgeon with the readings of the wearable"}
  # ---- one procedure per cause that the medical detectors and the diagnoser can name (docs/procedure-mediche.md has the sources and the
  # open questions for the bioengineer). `cause` is matched EXACTLY, so the joint causes (person + environment) carry a copy of the steps.
  - id: med_hypoxia_crew
    emergency: medical
    cause: hypoxia_crew
    title: "Low oxygen in the air: {subject} is exposed ({module})"
    steps: *hypoxia_steps
  - id: med_co_crew
    emergency: medical
    cause: co_exposure_crew
    title: "Carbon monoxide in the air: {subject} is exposed ({module})"
    steps: *co_steps
  - id: med_hypercapnia_crew
    emergency: medical
    cause: hypercapnia_crew
    title: "High CO2 in the air: {subject} is exposed ({module})"
    steps:
      - {id: s1, do: instruction, role: medical, duration_s: 20, text: "Reach {subject}; ask about headache, breathlessness, fatigue and dizziness [R20]"}
      - {id: s2, do: instruction, role: medical, duration_s: 30, text: "Move {subject} to a module with normal air, away from {module}; ESTIMATE"}
      - {id: s3, do: instruction, role: systems, duration_s: 30, text: "Check the CO2 of {module} on the MCA and the scrubber (CDRA); keep the fans of {module} running so the CO2 does not pool around the person [R20]"}
      - {id: s4, do: question, role: systems, duration_s: 15, auto_answer: "no", text: "Is the CO2 of {module} still above the limit (3 mmHg, 1 h average [R21])?", on_pass: s5, on_fail: s6}
      - {id: s5, do: instruction, role: systems, duration_s: 30, text: "Wake the standby scrubber, open the hatches to the neighbouring modules for the IMV exchange; report to the flight surgeon", on_pass: s7}
      - {id: s6, do: instruction, role: medical, duration_s: 15, text: "The air is back in range: keep {subject} at rest and watch the symptoms"}
      - {id: s7, do: check, metric: resp_rate, max: 20, within_s: 900, on_pass: done, on_fail: s8}
      - {id: s8, do: escalate, text: "Breathing rate of {subject} is not back to normal: call the flight surgeon"}
  - id: med_crew_baseline
    emergency: medical
    cause: crew_baseline
    title: "{subject} is out of their own baseline (cause not named)"
    steps:
      - {id: s1, do: instruction, role: medical, duration_s: 20, text: "Reach {subject}; ask how they feel and about what they did in the last hours (exercise, meal, sleep) [R9]"}
      - {id: s2, do: instruction, role: medical, duration_s: 30, text: "Measure again at rest: pulse, breathing rate, temperature, SpO2, with the medical kit instruments [R12]"}
      - {id: s3, do: check, metric: hr, max: 100, within_s: 900, on_pass: done, on_fail: s4}
      - {id: s4, do: escalate, text: "The readings of {subject} stay off their baseline: report to the flight surgeon with the wearable data"}
  - id: med_fever
    emergency: medical
    cause: fever
    title: "Raised temperature: suspected fever ({subject})"
    steps:
      - {id: s1, do: instruction, role: medical, duration_s: 20, text: "Reach {subject}; measure the temperature with the medical kit thermometer and ask about symptoms (cough, sore throat, chills) [R12]"}
      - {id: s2, do: instruction, role: medical, duration_s: 30, text: "Rest and fluids; medication from the kit only as the flight surgeon says [R12]"}
      - {id: s3, do: check, metric: core_temp_c, max: 38.0, within_s: 3600, on_pass: done, on_fail: s4}
      - {id: s4, do: escalate, text: "Temperature not falling: call the flight surgeon"}
  - id: med_respiratory
    emergency: medical
    cause: respiratory_infection
    title: "Suspected respiratory infection ({subject})"
    steps:
      - {id: s1, do: instruction, role: medical, duration_s: 20, text: "Reach {subject}; ask about cough, sore throat and breathlessness; give a mask to limit the spread in the cabin; ESTIMATE"}
      - {id: s2, do: instruction, role: medical, duration_s: 30, text: "Measure temperature, breathing rate and SpO2 at rest; report to the flight surgeon, who decides the treatment [R12]"}
      - {id: s3, do: check, metric: spo2, min: 94, within_s: 600, on_pass: s4, on_fail: s5}
      - {id: s4, do: check, metric: core_temp_c, max: 38.0, within_s: 3600, on_pass: done, on_fail: s5}
      - {id: s5, do: escalate, text: "SpO2 low or temperature not falling: call the flight surgeon at once; oxygen with the Variable Oxygen System if SpO2 stays low [R13]"}
  - id: med_dehydration
    emergency: medical
    cause: dehydration
    title: "Signs of dehydration ({subject})"
    steps:
      - {id: s1, do: instruction, role: medical, duration_s: 20, text: "Reach {subject}; ask about thirst, dizziness and how much they drank [R24]"}
      - {id: s2, do: instruction, role: medical, duration_s: 30, text: "Oral rehydration with the drinks of the galley; check the water supply and the exercise schedule of {subject} [R24]"}
      - {id: s3, do: check, metric: hr, max: 100, within_s: 1800, on_pass: done, on_fail: s4}
      - {id: s4, do: escalate, text: "Heart rate still raised after rehydration: report to the flight surgeon"}
  - id: med_afib
    emergency: medical
    cause: atrial_fibrillation_suspected
    title: "Irregular fast heart rhythm: suspected atrial fibrillation ({subject})"
    steps:
      - {id: s1, do: instruction, role: medical, duration_s: 15, text: "Reach {subject}; rest, sitting or floating still; ask about palpitations, chest pain, dizziness or breathlessness [R16]"}
      - {id: s2, do: instruction, role: medical, duration_s: 30, text: "Take the pulse by hand and record an ECG with the kit device, if available [R12]"}
      - {id: s3, do: instruction, role: medical, duration_s: 20, text: "Report at once to the flight surgeon with the ECG: the decision on the treatment is theirs [R16] [R23]"}
      - {id: s4, do: check, metric: hr, max: 110, within_s: 900, on_pass: done, on_fail: s5}
      - {id: s5, do: escalate, text: "The rhythm is not settling: the flight surgeon decides; prepare for an urgent return if they say so"}
  - id: med_svt
    emergency: medical
    cause: svt_suspected
    title: "Very fast regular heart rhythm: suspected supraventricular tachycardia ({subject})"
    steps:
      - {id: s1, do: instruction, role: medical, duration_s: 15, text: "Reach {subject}; rest, ask about palpitations, chest pain, dizziness or fainting [R16]"}
      - {id: s2, do: instruction, role: medical, duration_s: 30, text: "Take the pulse and record an ECG with the kit device, if available [R12]"}
      - {id: s3, do: instruction, role: medical, duration_s: 20, text: "Report at once to the flight surgeon: manoeuvres and medication only as they say [R16] [R22]"}
      - {id: s4, do: check, metric: hr, max: 110, within_s: 900, on_pass: done, on_fail: s5}
      - {id: s5, do: escalate, text: "Heart rate not settling: the flight surgeon decides; keep the defibrillator ready"}
  - id: med_bradycardia
    emergency: medical
    cause: bradycardia
    title: "Slow heart rate ({subject})"
    steps:
      - {id: s1, do: instruction, role: medical, duration_s: 20, text: "Reach {subject}; ask about dizziness, fainting, chest pain; note whether they are resting or asleep [R16]"}
      - {id: s2, do: instruction, role: medical, duration_s: 30, text: "Take the pulse by hand and measure blood pressure if the kit has the device; report to the flight surgeon [R12]"}
      - {id: s3, do: check, metric: hr, min: 45, within_s: 900, on_pass: done, on_fail: s4}
      - {id: s4, do: escalate, text: "Heart rate stays low: call the flight surgeon at once"}
  - id: med_stress
    emergency: medical
    cause: acute_stress
    title: "Acute stress ({subject})"
    steps:
      - {id: s1, do: instruction, role: incident_commander, duration_s: 20, text: "Talk to {subject}; take them to a quiet place and reduce the workload for now [R26]"}
      - {id: s2, do: instruction, role: medical, duration_s: 30, text: "Slow breathing together; check that nothing physical explains it (temperature, SpO2, CO2 of the module); ESTIMATE"}
      - {id: s3, do: check, metric: hr, max: 100, within_s: 900, on_pass: done, on_fail: s4}
      - {id: s4, do: escalate, text: "Not settling: report to the flight surgeon and the psychological support team [R26]"}
  - id: med_motion_sickness
    emergency: medical
    cause: space_motion_sickness
    title: "Space motion sickness ({subject})"
    steps:
      - {id: s1, do: instruction, role: medical, duration_s: 20, text: "Reach {subject}; keep the head still, a bag at hand, a fixed visual reference [R17]"}
      - {id: s2, do: instruction, role: medical, duration_s: 30, text: "Medication from the kit only as the flight surgeon or the medical checklist says; report the symptoms [R17] [R12]"}
  - id: med_exertion
    emergency: medical
    cause: abnormal_exertion
    title: "Heart rate and temperature too high for the exercise ({subject})"
    steps:
      - {id: s1, do: instruction, role: medical, duration_s: 15, text: "{subject}: stop the exercise now and rest; ask about chest pain, dizziness, nausea [R15]"}
      - {id: s2, do: instruction, role: medical, duration_s: 30, text: "Cool the person (cold pack) and oral fluids; check the temperature of {module} [R15] [R25]"}
      - {id: s3, do: check, metric: hr, max: 100, within_s: 900, on_pass: s4, on_fail: s5}
      - {id: s4, do: check, metric: core_temp_c, max: 38.5, within_s: 1800, on_pass: done, on_fail: s5}
      - {id: s5, do: escalate, text: "Heart rate or temperature not back to rest values: call the flight surgeon"}
  - id: sensor_check
    emergency: sensor_fault
    title: "Sensor not to be trusted: {subject}"
    steps:
      - {id: s1, do: instruction, role: systems, duration_s: 30, text: "Do not trust {subject}: compare it with its redundant sensor and with the MCA"}
      - {id: s2, do: instruction, role: systems, duration_s: 60, text: "Recalibrate or replace the sensor; the readings of the others stay valid"}
  - id: anomaly_check
    emergency: anomaly
    title: "Unexplained anomaly in {module}"
    steps:
      - {id: s1, do: instruction, role: systems, duration_s: 30, text: "Look at the readings named in the evidence and compare the redundant sensors of {module}"}
      - {id: s2, do: instruction, role: systems, duration_s: 60, text: "Inspect the subsystem for a visible cause (fan, filter, condensate, valve)"}
  - id: toxic_response
    emergency: toxic
    title: "Toxic atmosphere in {module}"
    steps:
      - {id: s1, do: instruction, duration_s: 10, text: "Masks on; leave {module} for a clean module and close the hatch behind you (as the crew did in the January 2015 ammonia alarm [R7])"}
      - {id: s2, do: instruction, role: systems, duration_s: 60, text: "Measure with the detector tubes before anyone goes back in"}
