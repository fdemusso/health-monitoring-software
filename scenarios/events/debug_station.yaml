# PLACEHOLDER - station with the monitoring system and NO scheduled faults: events are caused at runtime (debug button /
# Engine.inject). Luca's STATION atmosphere (orbital_station profile, 758 mmHg, 21 % O2), like the other event scenarios.
name: evt_debug_station
seed: 42
dt_s: 1.0
duration_days: 1
start_time_of_day_h: 7.0
environment: ../environments/orbital_station.yaml
environment_overrides:
  atmosphere: {pressure_kpa: 101.06, o2_fraction: 0.21, co2_ppm: 2500}
layout: [../base_layout.yaml, ../sensors_placeholder.yaml, ../actuators_placeholder.yaml]
crew: ../crew.yaml
monitor: ../monitor_placeholder.yaml
export: {format: parquet, chunk_hours: 1.0, long: true, wide: true}
