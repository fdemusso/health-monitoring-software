# PLACEHOLDER - event scenario. Fire in the lab at 13:00 (1 kW, ~500 kJ of fuel): heat, O2 consumed, CO2, CO and smoke. Scheduled
# fault only (like the other events); the monitoring response is exercised with `debug_station.yaml` + `Engine.inject`.
name: evt_fire
seed: 42
dt_s: 1.0
duration_days: 0.1666666667     # 4 h
start_time_of_day_h: 12.0
environment: ../environments/orbital_station.yaml
environment_overrides:
  atmosphere: {pressure_kpa: 101.06, o2_fraction: 0.21, co2_ppm: 2500}   # Luca's STATION profiles: 758 mmHg, 21.0 % O2, 0.25 % CO2
layout: [../base_layout.yaml, ../sensors_placeholder.yaml, ../actuators_placeholder.yaml]
crew: ../crew.yaml
faults: fire_faults.yaml
export: {format: parquet, chunk_hours: 1.0, long: true, wide: true}
